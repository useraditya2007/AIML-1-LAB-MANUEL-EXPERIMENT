<DOCTYPE! html>

<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
</head>

<body>
    <h1 style="text-align: center; color:blueviolet"><u>Hotel Booking</u></h1>
    <p style="text-align: center;">Welcome to our hotel booking website! Please fill out the form below to make a reservation.</p>
<hr> 
    <form >
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder=" your Full Name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder=" your Email Address" required><br><br>

        <label for="checkin">Check-in Date:</label><br>
        <input type="date" id="checkin" name="checkin" placeholder="booking date Date" required><br><br>


        <label for="checkout">Check-out Date:</label><br>
        <input type="date" id="checkout" name="checkout" required><br><br>

        <label for="roomtype">Room Type:</label><br>
        <select id="roomtype" name="roomtype">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
        </select><br><br>
        <label for="guests">Number of Guests:</label><br>
        <textarea id="guests" name="guests" rows="1" cols="30"></textarea>
        <br><br>

        <label for="message">Special Requests:</label><br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

        <button type="submit" >Book Now</button>
        <button type="reset" >Clear Form</button>

       
    </form>

    <hr>
    <footer style="text-align: center;">
       &copy; 2026 Hotel Booking. All rights reserved.
      <br>&reg;All Rights are Reserved.
    </footer>

</body>

</html>
